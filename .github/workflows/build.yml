name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备目录
        run: |
          mkdir -p bin core
          chmod 0755 scripts/* *.sh || true

      - name: 下载 mihomo (arm64-v8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/MetaCubeX/mihomo/releases/latest
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H 'Accept: application/vnd.github+json' "$api" | jq -r .tag_name)
          [ -n "$tag" ] && [ "$tag" != null ] || { echo '无法获取 mihomo release tag'; exit 1; }
          echo "mihomo $tag"
          # 资产名形如 mihomo-android-arm64-v8-v1.19.32.gz
          url="https://github.com/MetaCubeX/mihomo/releases/download/${tag}/mihomo-android-arm64-v8-${tag}.gz"
          curl -fsSL -o /tmp/mihomo.gz "$url"
          gunzip -c /tmp/mihomo.gz > bin/mihomo
          chmod 0755 bin/mihomo
          ./bin/mihomo -v

      - name: 下载 geo 数据
        run: |
          set -euo pipefail
          base=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
          curl -fsSL -o core/GeoIP.dat   "$base/geoip.dat"
          curl -fsSL -o core/GeoSite.dat "$base/geosite.dat"
          curl -fsSL -o core/Country.mmdb "$base/country.mmdb"
          ls -lh core

      - name: 打包
        run: ./build.sh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Mihomo-module
          path: dist/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
