# 按应用分流清单
#
# mode: blacklist -> 名单内的应用「不走」代理，其余全部走代理
# mode: whitelist -> 只有名单内的应用「走」代理，其余直连
#
# 名单为空 + blacklist = 全部应用走代理（默认）
#
# 每行一个包名。要指定工作资料/多用户，可写成 "用户id:包名"，例如:
#   10:com.tencent.mm
#
# TPROXY 模式：通过 iptables -m owner --uid-owner 实现（本机无 ipset，只能按 uid）
# TUN 模式   ：写进内核配置的 tun.include-package / tun.exclude-package

mode: blacklist
