# Mihomo 配置——模块不改写这个文件，是唯一的配置来源。
# 改完保存后执行一次重启生效: sh /data/adb/modules/mihomo_module/scripts/mihomo.tool restart
#
# 运行模式由本文件决定：二选一，不能同时写
#   TPROXY : 写顶层 tproxy-port —— iptables 规则与策略路由由模块建立
#   TUN    : 不写 tproxy-port、只写 tun.enable: true —— 网卡/路由/规则全部由内核自建
#
# 两者同时写会互相喂包（TUN 的 auto-route 把默认路由指向网卡，TPROXY 的 mark 又
# 把包抢回 lo），流量直接不通。模块不替你猜，直接拒绝启动并提示删掉哪一个。
#
# TPROXY 模式两条硬要求：
#   1. dns.listen 必须写（否则 53 被劫持到不存在的端口，所有应用解析失败）
#   2. enhanced-mode 必须是 redir-host（fake-ip 的 198.18.0.0/16 会被内核判为
#      local 直接放行，永远进不了 tproxy，表现为「能解析但连不上」）
#
# 下面默认给的是 TPROXY 模式（UDP 全代理），TUN 配置见文件末尾注释。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

# 面板：内核以 -d /data/adb/mihomo/core 运行，所以这里写相对路径 ui
external-controller: 127.0.0.1:9090
external-ui: ui
# secret: "改成你自己的密码"

profile:
  store-selected: true
  store-fake-ip: false

# TPROXY 入站端口（透明代理收货口，应用不需要知道它）
tproxy-port: 7893

# 要用 TUN 就删掉上面那行 tproxy-port，并打开下面这一段：
# tun:
#   enable: true
#   stack: mixed
#   device: mihomo
#   mtu: 1500
#   auto-route: true            # TUN 必需：跟随 wifi/移动网络切换重建路由
#   auto-detect-interface: true # 出站绑定正确的物理网卡
#   dns-hijack:
#     - "any:53"
#   # auto-redirect 只在「不开 Android VPN、纯靠 iptables 抓流量」的场景需要，
#   # 常规使用请留空（它是第二层劫持，和内核自身路由重复）。

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.4.4:853
    - tls://1.1.1.1:853

proxies: []

proxy-groups:
  - name: 代理
    type: select
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,代理
