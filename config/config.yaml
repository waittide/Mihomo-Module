# Mihomo 用户配置（模块不会修改这个文件）
#
# 模块只做三件事：
#   1. 读取本文件，去掉 tun / external-controller / tproxy-port 三个顶层键
#   2. 追加它自己生成的 tun 段（由安装时选择的 TPROXY / TUN 决定）
#   3. TPROXY 模式下追加 tproxy-port
# 生成结果写到 /data/adb/mihomo/core/config.yaml，内核实际运行的是那个文件。
# 所以：改完这里执行 `mihomo.tool restart` 即可生效。
#
# 注意：本文件只能是单个 YAML 文档，重复的顶层键会让 mihomo 直接报错。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - tls://8.8.4.4:853
    - tls://1.1.1.1:853

proxies: []

proxy-groups:
  - name: 代理
    type: select
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,代理
