# Mihomo 配置——模块不改写这个文件，是唯一的配置来源。
# 改完保存后执行一次重启生效: sh /data/adb/modules/mihomo_module/scripts/mihomo.tool restart
#
# 运行模式由本文件决定，二选一：
#   TUN    : 写 tun: 段并设置 enable: true —— 网卡/路由/规则全部由内核自建（默认，开箱可用）
#   TPROXY : 写顶层 tproxy-port —— 模块只负责启停内核，不建立任何 iptables 规则与策略路由，
#            mangle TPROXY、nat DNS 重定向、ip rule / ip route 都需要你自己配置
#
# 两者同时写没有意义：TUN 的 auto-route 把默认路由指向网卡，TPROXY 的 mark 又把包
# 抢回 lo，互相喂包会让流量全部不通。
#
# 下面默认给的是 TUN 模式，TPROXY 写法见文件末尾注释。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

# 面板：内核以 -d /data/adb/mihomo/core 运行，所以这里写相对路径 ui
external-controller: 127.0.0.1:9090
external-ui: ui
# secret: "改成你自己的密码"

profile:
  store-selected: true
  store-fake-ip: false

# TUN 入站：网卡、路由、dns 劫持全部由内核自己维护
tun:
  enable: true
  stack: mixed
  device: mihomo
  mtu: 1500
  auto-route: true            # TUN 必需：跟随 wifi/移动网络切换重建路由
  auto-detect-interface: true # 出站绑定正确的物理网卡
  dns-hijack:
    - "any:53"
  # 按应用分流（二选一，不能同时写）：
  # include-package:            # 只代理名单内的应用
  #   - com.android.chrome
  # exclude-package:            # 名单内的应用直连
  #   - com.tencent.mm

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.4.4:853
    - tls://1.1.1.1:853

proxies: []

proxy-groups:
  - name: 代理
    type: select
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,代理

# ---- TPROXY 写法（要用就把上面的 tun: 段整段删掉，只保留下面这行）----
# 模块不建立任何 iptables 规则，下面这些都要你自己配：
#   mangle PREROUTING/OUTPUT → TPROXY --on-port <tproxy-port>，出站包打 mark
#   nat PREROUTING/OUTPUT → REDIRECT 到 dns.listen 的端口
#   ip rule fwmark <mark>/<mask> table <table> + 对应 ip route
# 另外 enhanced-mode 必须用 redir-host：fake-ip 的 198.18.0.0/16 会被内核判为
# local 直接放行，永远进不了 tproxy，表现为「能解析但连不上」。
#
# tproxy-port: 7893
