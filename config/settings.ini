# Mihomo 模块设置
# 修改后执行: /data/adb/modules/mihomo_module/scripts/mihomo.tool restart
# 安装时选择的结果会写入 network_mode，一般不用手改。

# 网络模式: tproxy | tun | 留空（留空则不启动内核）
network_mode=tproxy

# TPROXY 转发端口（iptables 重定向到这里，需与内核配置一致）
tproxy_port=7893

# DNS 监听端口（tproxy 模式靠 iptables 把 53 重定向到这里）
dns_port=53

# TUN 设备名 / 协议栈 / MTU（仅 tun 模式生效）
tun_device=mihomo
tun_stack=mixed
tun_mtu=1500

# 启用 IPv6 规则
ipv6=true

# 策略路由标识（fwmark / table / rule preference）
mark_id=2024
table_id=2024
pref_id=5200

# 内核运行用户组（需要 net_admin 组才能建 tun / 绑定低端口）
core_group=root:net_admin

# 外部控制器默认值（用户 config.yaml 里写了 external-controller 时以用户为准）
external_controller=127.0.0.1:9090

# 是否监听 config.yaml 变更自动热重载（1=监听）
config_watch=true
